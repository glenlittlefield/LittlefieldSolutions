      --gray-800: #26384d;

    * {

    body {

    header {

    .brand {

      text-decoration: none;
      color: var(--white);

    function switchTab(format) {
      currentFormat = format;
      document.getElementById('tab-csv').classList.toggle('active', format === 'csv');
      document.getElementById('tab-json').classList.toggle('active', format === 'json');
      
      const txt = document.getElementById('import-data');
      if (format === 'csv') {
        txt.placeholder = 'Paste CSV data here...';
      } else {
        txt.placeholder = 'Paste JSON array here...';

    }

    function loadSampleData() {
      const txt = document.getElementById('import-data');
      if (currentFormat === 'csv') {
        txt.value = sampleCSV;
      } else {
        txt.value = sampleJSON;
      }
    }

    // Helper function to parse CSV properly (handling commas in quotes)
    function parseCSV(text) {
      const lines = [];
      let row = [""];
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        let c = text[i];
        let next = text[i+1];

        if (c === '"') {
          if (inQuotes && next === '"') {
            row[row.length - 1] += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (c === ',' && !inQuotes) {
          row.push('');
        } else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          lines.push(row);
          row = [''];
        } else {
          row[row.length - 1] += c;
        }
      }
      if (row.length > 1 || row[0] !== '') {
        lines.push(row);
      }
      return lines;
    }

    function parseImportData() {
      const text = document.getElementById('import-data').value.trim();
      if (!text) {
        alert('Please paste some data to import.');
        return;
      }

      let parsedLeads = [];

      try {
        if (currentFormat === 'json') {
          const arr = JSON.parse(text);
          if (!Array.isArray(arr)) throw new Error('Data must be a JSON array of objects.');
          parsedLeads = arr.map(item => ({
            business_name: item.business_name || item.name || 'Unnamed Business',
            email: item.email || '',
            location: item.location || 'Georgia',
            industry: item.industry || 'Business Services',
            status: 'draft',
            customSubject: null,
            customBody: null
          }));
        } else {
          // CSV Parser
          const rows = parseCSV(text);
          if (rows.length < 2) throw new Error('CSV must have a header row and at least one data row.');
          
          const headers = rows[0].map(h => h.trim().toLowerCase());
          
          const nameIdx = headers.findIndex(h => h.includes('name') || h.includes('business'));
          const emailIdx = headers.findIndex(h => h.includes('email') || h.includes('mail'));
          const locIdx = headers.findIndex(h => h.includes('location') || h.includes('city') || h.includes('area'));
          const indIdx = headers.findIndex(h => h.includes('industry') || h.includes('type') || h.includes('sector'));

          if (nameIdx === -1 || emailIdx === -1) {
            throw new Error('CSV headers must include fields representing "business_name" and "email".');
          }

          for (let i = 1; i < rows.length; i++) {
            const row = rows[i];
            if (row.length < 2 || !row[nameIdx]) continue;
            
            parsedLeads.push({
              business_name: row[nameIdx].trim(),
              email: row[emailIdx] ? row[emailIdx].trim() : '',
              location: locIdx !== -1 && row[locIdx] ? row[locIdx].trim() : 'Georgia',
              industry: indIdx !== -1 && row[indIdx] ? row[indIdx].trim() : 'Business Services',
              status: 'draft',
              customSubject: null,
              customBody: null
            });
          }
        }

        leads = parsedLeads;
        activeLeadIndex = null;
        updateStats();
        renderLeadsList();
        
        // Hide editor and show placeholder
        document.getElementById('editor-view').style.display = 'none';
        document.getElementById('placeholder-view').style.display = 'flex';

      } catch (err) {
        alert('Error parsing data: ' + err.message);
      }
    }

    function updateStats() {
      const total = leads.length;
      const sent = leads.filter(l => l.status === 'sent').length;
      const pending = total - sent;

      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-pending').textContent = pending;
      document.getElementById('stat-sent').textContent = sent;
    }

    function renderLeadsList() {
      const container = document.getElementById('leads-container');
      container.innerHTML = '';
      
      const filterText = document.getElementById('search-input').value.toLowerCase();

      leads.forEach((lead, index) => {
        if (filterText && 
            !lead.business_name.toLowerCase().includes(filterText) && 
            !lead.location.toLowerCase().includes(filterText) && 
            !lead.industry.toLowerCase().includes(filterText)) {
          return;
        }

        const item = document.createElement('div');
        item.className = `lead-item ${index === activeLeadIndex ? 'active' : ''}`;
        item.onclick = () => selectLead(index);

        const badgeClass = lead.status === 'sent' ? 'badge-sent' : 'badge-draft';
        const badgeText = lead.status === 'sent' ? 'Sent' : 'Draft';

        item.innerHTML = `
          <div class="lead-header">
            <span class="lead-name">${lead.business_name}</span>
            <span class="lead-badge ${badgeClass}">${badgeText}</span>
          </div>
          <div class="lead-meta">
            <span class="badge-industry">${lead.industry}</span>
            <span class="badge-location">${lead.location}</span>
          </div>
        `;

        container.appendChild(item);
      });
    }

    function filterLeads() {
      renderLeadsList();
    }

    function selectLead(index) {
      // Save current input changes first if a lead was already active
      if (activeLeadIndex !== null) {
        saveCurrentChanges();
      }

      activeLeadIndex = index;
      renderLeadsList();

      const lead = leads[index];
      
      document.getElementById('placeholder-view').style.display = 'none';
      document.getElementById('editor-view').style.display = 'block';

      document.getElementById('edit-business-name').textContent = lead.business_name;
      document.getElementById('edit-industry').textContent = lead.industry;
      document.getElementById('edit-location').textContent = lead.location;
      document.getElementById('edit-to').value = lead.email;

      // Status badge
      const statusBadge = document.getElementById('edit-status-badge');
      statusBadge.className = `lead-badge ${lead.status === 'sent' ? 'badge-sent' : 'badge-draft'}`;
      statusBadge.textContent = lead.status === 'sent' ? 'Sent' : 'Draft';

      // Load generated or customized content
      if (lead.customSubject !== null) {
        document.getElementById('edit-subject').value = lead.customSubject;
      } else {
        const generated = generateEmailContent(lead);
        document.getElementById('edit-subject').value = generated.subject;
      }

      if (lead.customBody !== null) {
        document.getElementById('edit-body').value = lead.customBody;
      } else {
        const generated = generateEmailContent(lead);
        document.getElementById('edit-body').value = generated.body;
      }
    }

    function saveCurrentChanges() {
      if (activeLeadIndex === null) return;
      
      leads[activeLeadIndex].email = document.getElementById('edit-to').value;
      leads[activeLeadIndex].customSubject = document.getElementById('edit-subject').value;
      leads[activeLeadIndex].customBody = document.getElementById('edit-body').value;
    }

    function sendActiveEmail() {
      if (activeLeadIndex === null) return;

      saveCurrentChanges();
      const lead = leads[activeLeadIndex];

      const to = lead.email;
      const subject = encodeURIComponent(lead.customSubject || generateEmailContent(lead).subject);
      const body = encodeURIComponent(lead.customBody || generateEmailContent(lead).body);

      // Open mailto link
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;

      // Mark as sent
      lead.status = 'sent';
      updateStats();
      renderLeadsList();

      // Update active badge in editor
      const statusBadge = document.getElementById('edit-status-badge');
      statusBadge.className = 'lead-badge badge-sent';
      statusBadge.textContent = 'Sent';

      // Automatically move to the next lead after a short delay
      setTimeout(() => {
        if (activeLeadIndex !== null && activeLeadIndex < leads.length - 1) {
          selectLead(activeLeadIndex + 1);
        }
      }, 1000);
    }

    function copyText(elementId, successMsg) {
      const el = document.getElementById(elementId);
      el.select();
      el.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(el.value)
        .then(() => {
          alert(successMsg);
        })
        .catch(err => {
          console.error('Failed to copy: ', err);
        });
    }
  </script>
